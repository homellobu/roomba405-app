<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Roomba</title>
<style>
  :root {
    --green: #2e5233;
    --green-dark: #24422a;
    --text: #26291f;
    --dim: #9a9d8c;
    --border: #e6e4d6;
    --ring: #cfe0b4;
    --ok: #6fa06f;
    --warn: #c9a13f;
    --bad: #c05d50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #d9d6c2;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    background: url("/plate.jpg") 0 0 / 100% 100% no-repeat;
    overflow: hidden;
  }
  .overlay-label {
    font-size: 0.85em; letter-spacing: 0.16em; font-weight: 600;
    color: var(--dim); text-transform: uppercase;
  }
  #statusline {
    position: absolute; left: 4.6%; top: 24%; width: 34%;
    font-size: 1.5em; font-weight: 600; color: var(--dim);
  }
  #statusline.ok { color: #3f6d3f; }
  #statusline.warn { color: #a8842f; }
  #statusline.bad { color: var(--bad); }
  .panel {
    position: absolute; left: 56.3%; top: 14.65%; width: 37.7%; height: 55.9%;
    background: #fff; border-radius: 1.6em;
    box-shadow: 0 1em 3em rgba(60, 65, 40, 0.18);
    padding: 1.6em 1.8em;
    display: flex; flex-direction: column;
  }
  .select-wrap { position: relative; margin-top: 1em; }
  .select-wrap .house {
    position: absolute; left: 0.9em; top: 50%; transform: translateY(-50%);
    font-size: 1em; pointer-events: none;
  }
  select {
    width: 100%; appearance: none; -webkit-appearance: none;
    background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%239a9d8c' stroke-width='2' fill='none' stroke-linecap='round'/></svg>") no-repeat right 1em center;
    border: 1px solid var(--border); border-radius: 0.9em;
    padding: 0.85em 2.4em 0.85em 2.6em;
    font-size: 1.05em; color: var(--text); font-family: inherit; cursor: pointer;
  }
  .btn-primary {
    margin-top: 1.2em; border: none; cursor: pointer;
    background: var(--green); color: #fff; font-size: 1.1em; font-weight: 600;
    padding: 1em 0; border-radius: 999px; font-family: inherit;
    box-shadow: 0 0.5em 1.4em rgba(46, 82, 51, 0.30);
    transition: background .15s, transform .1s;
  }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:active { transform: scale(0.98); }
  .rounds { display: flex; gap: 1.2em; justify-content: center; margin-top: 1.2em; padding-bottom: 0.4em; align-items: center; }
  .round {
    width: 3.7em; height: 3.7em; border-radius: 50%; border: 1px solid #efece0; cursor: pointer;
    background: #fff; font-size: 1em;
    box-shadow: 0 0.35em 1em rgba(60, 65, 40, 0.14);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5em;
    transition: transform .1s, box-shadow .15s;
  }
  .round.small { width: 2.9em; height: 2.9em; font-size: 1.15em; }
  .round:hover { box-shadow: 0 0.5em 1.4em rgba(60, 65, 40, 0.22); }
  .round:active { transform: scale(0.93); }
  #conn-dot {
    position: absolute; right: 9.4%; top: 4.4%;
    width: 1em; height: 1em; border-radius: 50%; background: var(--dim);
    box-shadow: 0 0.2em 0.6em rgba(60, 65, 40, 0.25);
  }
  #conn-dot.ok { background: var(--ok); }
  #conn-dot.bad { background: var(--bad); }
  #gear-hotspot {
    position: absolute; right: 3.4%; top: 2.6%; width: 4.5%; height: 6.5%;
    cursor: pointer; border-radius: 50%; z-index: 6;
  }
  #gear-hotspot:hover { background: rgba(255, 255, 255, 0.35); }
  #drawer {
    position: absolute; top: 0; right: 0; height: 100%; width: 34em; z-index: 4;
    background: #faf9f2; box-shadow: -0.6em 0 2.4em rgba(50, 55, 35, 0.25);
    transform: translateX(102%); transition: transform .25s ease;
    padding: 1.8em 1.6em; overflow-y: auto; font-size: 1em;
  }
  #drawer-close {
    position: absolute; top: 1em; right: 1em; z-index: 5;
    width: 2.2em; height: 2.2em; border-radius: 50%; border: none; cursor: pointer;
    background: #efede0; color: var(--text); font-size: 1em; font-family: inherit;
  }
  #drawer-close:hover { background: var(--ring); }
  #drawer.open { transform: translateX(0); }
  #drawer h3 { font-size: 1.05em; margin: 1.4em 0 0.5em; color: var(--text); }
  #drawer h3:first-child { margin-top: 0; }
  #drawer .btn-go {
    border: none; cursor: pointer; background: var(--green); color: #fff;
    font-size: 0.95em; font-weight: 600; padding: 0.7em 1.4em; border-radius: 999px;
    font-family: inherit;
  }
  #drawer select { font-size: 0.9em; padding: 0.5em 2em 0.5em 0.8em; width: auto; }
  #drawer .row { display: flex; gap: 0.6em; align-items: center; flex-wrap: wrap; }
  #drawer ul { list-style: none; }
  #drawer li {
    display: flex; align-items: center; gap: 0.5em;
    padding: 0.45em 0.2em; border-bottom: 1px solid var(--border); font-size: 0.95em;
  }
  #drawer li:last-child { border-bottom: none; }
  #drawer li .kind { margin-left: auto; font-size: 0.8em; color: var(--dim); }
  #drawer table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  #drawer th { text-align: left; color: var(--dim); font-size: 0.85em; padding: 0.3em; }
  #drawer td { padding: 0.4em 0.3em; border-top: 1px solid var(--border); }
  #drawer .empty { color: var(--dim); font-size: 0.9em; padding: 0.4em 0; }
  #log {
    max-height: 9em; overflow-y: auto; font-family: Menlo, monospace;
    font-size: 0.78em; line-height: 1.7; color: var(--text);
  }
  #log .t { color: var(--dim); margin-right: 0.6em; }
  #drawer .classic { font-size: 0.8em; color: var(--dim); margin-top: 1.5em; display: block; }
  .opts { display: flex; gap: 0.8em; margin-top: 1em; }
  .opts .field { flex: 1; }
  .opts label { display: block; font-size: 0.75em; color: var(--dim); margin: 0 0 0.3em 0.3em; }
  .opts select { width: 100%; padding: 0.55em 2em 0.55em 0.8em; }
  .btn-pill {
    border: none; cursor: pointer; background: #efede0; color: var(--text);
    font-size: 0.85em; padding: 0.55em 1em; border-radius: 999px; font-family: inherit;
  }
  .btn-pill:hover { background: var(--ring); }
  .maint-mini { margin-top: auto; }
  .maint-mini .overlay-label { margin-bottom: 0.6em; }
  .maint-mini .row { display: flex; flex-wrap: wrap; gap: 0.5em; }
</style>
</head>
<body>
<div id="stage">
  <div id="statusline">Conectando…</div>

  <div class="panel">
    <div class="overlay-label">Selecciona una habitación</div>
    <div class="select-wrap">
      <span class="house">🏠</span>
      <select id="room-select"><option>Todas las habitaciones</option></select>
    </div>
    <div class="opts">
      <div class="field">
        <label>Succión</label>
        <select id="suction">
          <option value="">Por defecto</option>
          <option value="low">Baja</option>
          <option value="medium">Media</option>
          <option value="high">Alta</option>
          <option value="turbo">Turbo</option>
        </select>
      </div>
      <div class="field">
        <label>Fregado</label>
        <select id="pad">
          <option value="">Por defecto</option>
          <option value="1">Bajo</option>
          <option value="2">Medio</option>
          <option value="3">Alto</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" id="btn-start">▶&nbsp; Empezar limpieza</button>
    <div class="rounds">
      <button class="round" id="btn-pause" title="Pausar">⏸</button>
      <button class="round" id="btn-dock" title="Volver a la base (con reintentos)">🏠</button>
      <button class="round" id="btn-find" title="Localizar">📍</button>
      <button class="round small" id="btn-resume" title="Reanudar">⏵</button>
      <button class="round small" id="btn-stop" title="Detener">⏹</button>
    </div>
    <div class="maint-mini">
      <div class="overlay-label">Mantenimiento</div>
      <div class="row">
        <button class="btn-pill" data-cmd="evac">🗑 Vaciar depósito</button>
        <button class="btn-pill" data-cmd="washpad">💧 Lavar pad</button>
        <button class="btn-pill" data-cmd="drypad">🌡 Secar pad</button>
        <button class="btn-pill" data-cmd="flrefill">💦 Rellenar agua</button>
      </div>
    </div>
  </div>

  <div id="conn-dot" title="Conexión con el robot"></div>
  <div id="gear-hotspot" title="Ajustes"></div>

  <div id="drawer">
    <button id="drawer-close" title="Cerrar">✕</button>
    <h3>Robot</h3>
    <div id="robot-info" class="empty">Sin datos todavía.</div>

    <h3>Habitaciones</h3>
    <div class="row">
      <button class="btn-pill" id="btn-load-rooms">↻ Actualizar</button>
    </div>
    <ul id="rooms-list"><li class="empty">Pulsa "Actualizar" para cargar el mapa.</li></ul>
    <div class="row" style="margin-top:0.6em;">
      <button class="btn-go" id="btn-clean-rooms">▶ Limpiar selección</button>
    </div>

    <h3>Rutinas</h3>
    <div class="row"><button class="btn-pill" id="btn-load-favs">↻ Actualizar</button></div>
    <ul id="favs-list"><li class="empty">Sin cargar.</li></ul>
    <div class="row" style="margin-top:0.6em;">
      <button class="btn-go" id="btn-start-fav">▶ Iniciar seleccionada</button>
    </div>

    <h3>Programaciones</h3>
    <div class="row"><button class="btn-pill" id="btn-load-scheds">↻ Actualizar</button></div>
    <table>
      <thead><tr><th>Nombre</th><th>Hora</th><th>Días</th><th>Activa</th></tr></thead>
      <tbody id="scheds-body"><tr><td colspan="4" class="empty">Sin cargar.</td></tr></tbody>
    </table>

    <h3>Registro de actividad</h3>
    <div id="log"></div>

    <a class="classic" href="/classic.html">Abrir interfaz clásica (ventanas y pestañas)</a>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const stage = $("stage");
const PHASES = {
  "charge": "Cargando", "run": "Limpiando", "stop": "En reposo", "pause": "En pausa",
  "hmUsrDock": "Volviendo a la base", "hmMidMsn": "Volviendo (media misión)",
  "hmPostMsn": "Volviendo (fin de misión)", "evac": "Vaciando depósito",
  "chargingerror": "Error de carga",
};
const CYCLES = {
  "none": "Inactivo", "clean": "Limpieza estándar", "spot": "Limpieza puntual",
  "dock": "Acoplándose", "evac": "Vaciado de depósito", "train": "Mapeo",
};
let rooms = [];
let favorites = [];

function fit() {
  stage.style.fontSize = (stage.clientWidth / 100) + "px";
}
window.addEventListener("resize", fit);
fit();

function log(msg) {
  const t = new Date().toTimeString().slice(0, 5);
  const row = document.createElement("div");
  row.innerHTML = `<span class="t">${t}</span>${msg}`;
  $("log").prepend(row);
}

async function api(path, body) {
  const opts = body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {};
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || res.statusText);
  return data;
}

function setConn(ok) {
  $("conn-dot").className = ok ? "ok" : "bad";
}

function robotInfo(st) {
  const bits = [];
  const bat = st.batPct;
  bits.push("Batería: " + (bat !== undefined && bat !== null ? bat + "%" : "—"));
  const bin = st.bin || null;
  bits.push("Depósito: " + (!bin ? "—" : bin.full ? "lleno" : bin.present === false ? "ausente" : "OK"));
  const el = $("robot-info");
  el.className = "";
  el.textContent = bits.join(" · ");
}

function updateStatus(st) {
  setConn(true);
  const m = st.cleanMissionStatus || {};
  const line = $("statusline");
  line.classList.remove("ok", "warn", "bad");
  if (m.error) {
    line.textContent = "⚠ " + (PHASES[m.phase] || "Error");
    line.classList.add("bad");
  } else if (m.phase) {
    line.textContent = "✓ " + (PHASES[m.phase] || m.phase);
    line.classList.add(m.phase === "run" || m.phase === "charge" ? "ok" : "warn");
  } else {
    line.textContent = "Robot en línea";
    line.classList.add("ok");
  }
  robotInfo(st);
  if (m.phase === "run" || m.phase === "charge") {
    log("Estado: " + (PHASES[m.phase] || m.phase) + (st.batPct !== undefined ? " · batería " + st.batPct + "%" : ""));
  }
}

async function refresh() {
  try {
    const data = await api("/api/status");
    if (data.connecting) {
      const line = $("statusline");
      line.className = "";
      line.textContent = "Conectando con el robot…";
      return;
    }
    updateStatus(data.status || {});
  } catch (e) {
    setConn(false);
    $("statusline").textContent = "Sin conexión con el robot";
    $("statusline").className = "bad";
  }
}

async function startCleaning() {
  const name = $("room-select").value;
  const suction = $("suction").value || null;
  const pad = $("pad").value ? parseInt($("pad").value) : null;
  try {
    if (name === "Todas las habitaciones") {
      await api("/api/command", {cmd: "start"});
      log("✓ Enviado: limpiar toda la casa");
    } else {
      await api("/api/clean", {rooms: [name], suction, pad});
      log(`✓ Enviado: limpiar ${name}`);
    }
  } catch (e) { log("✗ Fallo: " + e.message); }
}

function bindRound(id, cmd, label) {
  $(id).addEventListener("click", async () => {
    log("→ " + label);
    try {
      if (cmd === "dock") {
        await api("/api/dock-retry", {});
        log("→ Reintentos de vuelta a base en marcha");
      } else {
        await api("/api/command", {cmd});
        log("✓ Enviado: " + label);
      }
    } catch (e) { log("✗ Fallo: " + e.message); }
  });
}

document.querySelectorAll(".btn-pill[data-cmd]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const cmd = btn.dataset.cmd;
    log("→ " + cmd);
    try {
      await api("/api/dock-command", {cmd});
      log("✓ Enviado: " + cmd);
    } catch (e) { log("✗ Fallo: " + e.message); }
  });
});

$("btn-start").addEventListener("click", startCleaning);
bindRound("btn-pause", "pause", "Pausar");
bindRound("btn-resume", "resume", "Reanudar");
bindRound("btn-stop", "stop", "Detener");
bindRound("btn-dock", "dock", "Volver a la base");
bindRound("btn-find", "find", "Localizar");
$("gear-hotspot").addEventListener("click", (e) => {
  e.stopPropagation();
  $("drawer").classList.toggle("open");
});
$("drawer-close").addEventListener("click", () => $("drawer").classList.remove("open"));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("drawer").classList.remove("open");
});
stage.addEventListener("click", (e) => {
  if (!$("drawer").contains(e.target)) $("drawer").classList.remove("open");
});

$("btn-load-rooms").addEventListener("click", async () => {
  try {
    const data = await api("/api/rooms");
    rooms = data.rooms || [];
    const ul = $("rooms-list");
    ul.innerHTML = "";
    const sel = $("room-select");
    sel.innerHTML = "<option>Todas las habitaciones</option>";
    if (!rooms.length) { ul.innerHTML = "<li class='empty'>Sin mapa activo: deja que el robot mapee la casa primero.</li>"; return; }
    rooms.forEach((r, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<input type="checkbox" data-i="${i}"> ${r.name}<span class="kind">${r.type === "RID" ? "habitación" : "zona"}</span>`;
      ul.appendChild(li);
      const opt = document.createElement("option");
      opt.textContent = r.name;
      sel.appendChild(opt);
    });
    log(`✓ ${rooms.length} habitación(es)/zona(s) cargadas`);
  } catch (e) { log("✗ No se pudieron cargar habitaciones: " + e.message); }
});

$("btn-clean-rooms").addEventListener("click", async () => {
  const chosen = [...document.querySelectorAll("#rooms-list input:checked")].map(cb => rooms[cb.dataset.i].name);
  if (!chosen.length) { log("⚠ Selecciona al menos una habitación"); return; }
  const suction = $("suction").value || null;
  const pad = $("pad").value ? parseInt($("pad").value) : null;
  log("→ Limpiar: " + chosen.join(", "));
  try {
    await api("/api/clean", {rooms: chosen, suction, pad});
    log("✓ Comando enviado");
  } catch (e) { log("✗ Fallo al enviar: " + e.message); }
});

$("btn-load-favs").addEventListener("click", async () => {
  try {
    const data = await api("/api/favorites");
    favorites = data.favorites || [];
    const ul = $("favs-list");
    ul.innerHTML = "";
    if (!favorites.length) { ul.innerHTML = "<li class='empty'>No hay rutinas guardadas (créalas en la app de iRobot).</li>"; return; }
    favorites.forEach((f, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<input type="radio" name="fav" data-i="${i}"> ${f.name}<span class="kind">${f.steps ? f.steps + " paso(s)" : "vacía"}</span>`;
      ul.appendChild(li);
    });
    log(`✓ ${favorites.length} rutina(s) cargadas`);
  } catch (e) { log("✗ No se pudieron cargar rutinas: " + e.message); }
});

$("btn-start-fav").addEventListener("click", async () => {
  const cb = document.querySelector("#favs-list input:checked");
  if (!cb) { log("⚠ Selecciona una rutina"); return; }
  const fav = favorites[cb.dataset.i];
  log("→ Iniciando rutina: " + fav.name);
  try {
    await api("/api/favorite", {id: fav.id});
    log("✓ Rutina iniciada: " + fav.name);
  } catch (e) { log("✗ Fallo: " + e.message); }
});

$("btn-load-scheds").addEventListener("click", async () => {
  try {
    const data = await api("/api/schedules");
    const rows = data.schedules || [];
    const tb = $("scheds-body");
    tb.innerHTML = "";
    if (!rows.length) { tb.innerHTML = "<tr><td colspan='4' class='empty'>No hay programaciones en tu cuenta.</td></tr>"; return; }
    rows.forEach(s => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${s.name}</td><td>${s.time}</td><td>${s.days}</td><td>${s.enabled ? "Sí" : "No"}</td>`;
      tb.appendChild(tr);
    });
    log(`✓ ${rows.length} programación(es) cargadas`);
  } catch (e) { log("✗ No se pudieron cargar programaciones: " + e.message); }
});

refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
